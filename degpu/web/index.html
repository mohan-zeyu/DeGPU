<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#5963a4">
  <title>DeGPU</title>
  <link rel="stylesheet" href="/src/styles.css">
  <link rel="stylesheet" href="/src/accounts.css">
  <link rel="stylesheet" href="/src/market-refresh.css">
  <link rel="stylesheet" href="/src/presentation.css">
  <link rel="stylesheet" href="/src/results.css">
  <link rel="stylesheet" href="/src/refinement.css">
  <script type="module" src="/src/app.js"></script>
</head>
<body>
  <div class="app" id="app">
    <aside class="sidebar" aria-label="主导航">
      <a class="brand" href="#/overview">DeGPU</a>
      <nav aria-label="板块导航">
        <a href="#/overview" data-nav="overview">首页概览</a>
        <a href="#/providers" data-nav="providers">市场行情</a>
        <a href="#/new" data-nav="new">任务发布</a>
        <a href="#/jobs" data-nav="jobs">任务情况</a>
        <a href="#/supply" data-nav="supply">提供机器</a>
      </nav>
    </aside>
    <main class="main">
      <header class="topbar">
        <a id="chain-height" class="chain-height" href="#/chain">链上浏览</a>
        <label class="topbar-machine" id="topbar-machine" hidden>我的机器<select id="supply-provider-select" aria-label="我的机器"></select></label>
        <div class="identity-controls">
          <span id="backend-status" class="backend-status" role="status">连接中…</span>
          <a href="#/activity" data-nav="activity">活动日志</a>
          <a class="account-name" id="account-name" href="#/account">账户中心</a>
        </div>
      </header>
      <div class="workspace" id="workspace" tabindex="0" aria-label="页面内容">
        <div class="content" id="content"></div>
      </div>
    </main>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  <noscript>请启用 JavaScript 以使用 DeGPU。</noscript>
</body>
</html>
