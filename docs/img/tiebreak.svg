<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 530" width="1000" height="530" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1.5 L9 5 L1 8.5 z" fill="#dc2626"/></marker>
  </defs>
  <style>
    .t { font-size: 22px; font-weight: 760; fill: #0f172a; letter-spacing: -0.01em; }
    .s { font-size: 14.5px; fill: #64748b; }
    .num { font-size: 11.5px; fill: #94a3b8; font-weight: 600; }
    .ln { font-size: 13.5px; font-weight: 720; fill: #0f172a; }
    .lsub { font-size: 11.5px; fill: #64748b; }
    .eq { font-size: 15px; font-weight: 700; }
    .b { font-size: 13px; fill: #334155; }
    .bb { font-size: 13px; font-weight: 700; fill: #0f172a; }
    .h { font-size: 16px; font-weight: 740; fill: #0f172a; }
    .tag { font-size: 11.5px; font-weight: 750; letter-spacing: 0.14em; fill: #94a3b8; }
    .av { font-size: 13px; font-weight: 760; fill: #ffffff; }
    .ans { font-size: 13px; font-weight: 650; fill: #0f172a; }
  </style>
  <rect width="1000" height="530" rx="18" fill="#ffffff"/>
  <rect x="0.5" y="0.5" width="999" height="529" rx="18" fill="none" stroke="#e5e7eb"/>
  <text class="t" x="32" y="46">How a mismatch is settled</text>
  <text class="s" x="32" y="71">On a verified job every item is re-run once. Only the items that disagree go to a vote.</text>
  <text class="tag" x="32" y="110">A VERIFIED JOB WITH 10 ITEMS</text>
  <text class="num" x="184.0" y="136" text-anchor="middle">1</text>
  <text class="num" x="220.0" y="136" text-anchor="middle">2</text>
  <text class="num" x="256.0" y="136" text-anchor="middle">3</text>
  <text class="num" x="292.0" y="136" text-anchor="middle">4</text>
  <text class="num" x="328.0" y="136" text-anchor="middle">5</text>
  <text class="num" x="364.0" y="136" text-anchor="middle">6</text>
  <text class="num" x="400.0" y="136" text-anchor="middle">7</text>
  <text class="num" x="436.0" y="136" text-anchor="middle">8</text>
  <text class="num" x="472.0" y="136" text-anchor="middle">9</text>
  <text class="num" x="508.0" y="136" text-anchor="middle">10</text>
  <circle cx="40" cy="160" r="4.5" fill="#2563eb"/>
  <text class="ln" x="52" y="165">Main provider</text>
  <rect x="170" y="146" width="28" height="28" rx="6" fill="#eff6ff" stroke="#bfd3fb" stroke-width="1.5"/>
  <rect x="206" y="146" width="28" height="28" rx="6" fill="#eff6ff" stroke="#bfd3fb" stroke-width="1.5"/>
  <rect x="242" y="146" width="28" height="28" rx="6" fill="#eff6ff" stroke="#bfd3fb" stroke-width="1.5"/>
  <rect x="278" y="146" width="28" height="28" rx="6" fill="#eff6ff" stroke="#bfd3fb" stroke-width="1.5"/>
  <rect x="314" y="146" width="28" height="28" rx="6" fill="#eff6ff" stroke="#bfd3fb" stroke-width="1.5"/>
  <rect x="350" y="146" width="28" height="28" rx="6" fill="#eff6ff" stroke="#bfd3fb" stroke-width="1.5"/>
  <rect x="386" y="146" width="28" height="28" rx="6" fill="#eff6ff" stroke="#dc2626" stroke-width="2"/>
  <rect x="422" y="146" width="28" height="28" rx="6" fill="#eff6ff" stroke="#bfd3fb" stroke-width="1.5"/>
  <rect x="458" y="146" width="28" height="28" rx="6" fill="#eff6ff" stroke="#bfd3fb" stroke-width="1.5"/>
  <rect x="494" y="146" width="28" height="28" rx="6" fill="#eff6ff" stroke="#bfd3fb" stroke-width="1.5"/>
  <circle cx="40" cy="220" r="4.5" fill="#d97706"/>
  <text class="ln" x="52" y="225">Verifiers</text>
  <rect x="170" y="206" width="28" height="28" rx="6" fill="#fffbeb" stroke="#f3c98b" stroke-width="1.5"/>
  <rect x="206" y="206" width="28" height="28" rx="6" fill="#fffbeb" stroke="#f3c98b" stroke-width="1.5"/>
  <rect x="242" y="206" width="28" height="28" rx="6" fill="#fffbeb" stroke="#f3c98b" stroke-width="1.5"/>
  <rect x="278" y="206" width="28" height="28" rx="6" fill="#fffbeb" stroke="#f3c98b" stroke-width="1.5"/>
  <rect x="314" y="206" width="28" height="28" rx="6" fill="#fffbeb" stroke="#f3c98b" stroke-width="1.5"/>
  <rect x="350" y="206" width="28" height="28" rx="6" fill="#fffbeb" stroke="#f3c98b" stroke-width="1.5"/>
  <rect x="386" y="206" width="28" height="28" rx="6" fill="#fffbeb" stroke="#dc2626" stroke-width="2"/>
  <rect x="422" y="206" width="28" height="28" rx="6" fill="#fffbeb" stroke="#f3c98b" stroke-width="1.5"/>
  <rect x="458" y="206" width="28" height="28" rx="6" fill="#fffbeb" stroke="#f3c98b" stroke-width="1.5"/>
  <rect x="494" y="206" width="28" height="28" rx="6" fill="#fffbeb" stroke="#f3c98b" stroke-width="1.5"/>
  <text class="eq" x="184.0" y="191" text-anchor="middle" fill="#16a34a">=</text>
  <text class="eq" x="220.0" y="191" text-anchor="middle" fill="#16a34a">=</text>
  <text class="eq" x="256.0" y="191" text-anchor="middle" fill="#16a34a">=</text>
  <text class="eq" x="292.0" y="191" text-anchor="middle" fill="#16a34a">=</text>
  <text class="eq" x="328.0" y="191" text-anchor="middle" fill="#16a34a">=</text>
  <text class="eq" x="364.0" y="191" text-anchor="middle" fill="#16a34a">=</text>
  <text class="eq" x="400.0" y="191" text-anchor="middle" fill="#dc2626">≠</text>
  <text class="eq" x="436.0" y="191" text-anchor="middle" fill="#16a34a">=</text>
  <text class="eq" x="472.0" y="191" text-anchor="middle" fill="#16a34a">=</text>
  <text class="eq" x="508.0" y="191" text-anchor="middle" fill="#16a34a">=</text>
  <path d="M170 246 V252 H342 V246" stroke="#d97706" stroke-width="1.5" fill="none"/>
  <text class="lsub" x="256.0" y="268" text-anchor="middle">Verifier 1 re-runs 1–5</text>
  <path d="M350 246 V252 H522 V246" stroke="#d97706" stroke-width="1.5" fill="none"/>
  <text class="lsub" x="436.0" y="268" text-anchor="middle">Verifier 2 re-runs 6–10</text>
  <text class="b" x="32" y="312">The contract compares each pair of results. Item 7 differs,</text>
  <text class="b" x="32" y="330">so a third random provider, the <tspan class="bb">tie-breaker</tspan>, re-runs only that item.</text>
  <text class="tag" x="32" y="368">FOR EACH DISPUTED ITEM, THE MAJORITY OF 3 DECIDES</text>
  <circle cx="38" cy="388" r="3.5" fill="#dc2626"/>
  <text class="b" x="50" y="392"><tspan class="bb">Tie-breaker agrees with the verifier:</tspan> the main provider is slashed.</text>
  <circle cx="38" cy="410" r="3.5" fill="#dc2626"/>
  <text class="b" x="50" y="414"><tspan class="bb">Tie-breaker agrees with the main provider:</tspan> the verifier is slashed.</text>
  <circle cx="38" cy="432" r="3.5" fill="#94a3b8"/>
  <text class="b" x="50" y="436"><tspan class="bb">All three differ:</tspan> no majority, the item is not paid.</text>
  <rect x="381" y="141" width="38" height="98" rx="9" fill="none" stroke="#dc2626" stroke-width="1.25" stroke-dasharray="4 3"/>
  <path d="M532 190 H602" stroke="#dc2626" stroke-width="1.75" fill="none" marker-end="url(#ah)"/>
  <rect x="610" y="96" width="358" height="296" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <text class="tag" x="630" y="124">ITEM 7: THE VOTE</text>
  <circle cx="646" cy="158" r="15" fill="#2563eb"/>
  <text class="av" x="646" y="162.5" text-anchor="middle">M</text>
  <text class="ln" x="672" y="156">Main provider</text>
  <text class="lsub" x="672" y="172">said</text>
  <rect x="828" y="143" width="118" height="30" rx="15" fill="#fef2f2" stroke="#f5a3a3"/>
  <text class="ans" x="887" y="162.5" text-anchor="middle">“parachute”</text>
  <circle cx="646" cy="206" r="15" fill="#d97706"/>
  <text class="av" x="646" y="210.5" text-anchor="middle">V</text>
  <text class="ln" x="672" y="204">Verifier 2</text>
  <text class="lsub" x="672" y="220">said</text>
  <rect x="828" y="191" width="118" height="30" rx="15" fill="#f0fdf4" stroke="#86d7a3"/>
  <text class="ans" x="887" y="210.5" text-anchor="middle">“golf ball”</text>
  <circle cx="646" cy="254" r="15" fill="#db2777"/>
  <text class="av" x="646" y="258.5" text-anchor="middle">T</text>
  <text class="ln" x="672" y="252">Tie-breaker</text>
  <text class="lsub" x="672" y="268">re-ran it:</text>
  <rect x="828" y="239" width="118" height="30" rx="15" fill="#f0fdf4" stroke="#86d7a3"/>
  <text class="ans" x="887" y="258.5" text-anchor="middle">“golf ball”</text>
  <line x1="630" y1="288" x2="948" y2="288" stroke="#eef1f5"/>
  <text class="h" x="630" y="310">2 votes to 1: “golf ball” wins</text>
  <text class="b" x="630" y="334">The main provider is outvoted: it loses</text>
  <text class="b" x="630" y="352"><tspan class="bb" fill="#dc2626">0.3 ETH</tspan> of stake, which goes to the client.</text>
  <text class="b" x="630" y="370">The tie-breaker earns a <tspan class="bb">0.002 ETH</tspan> fee.</text>
  <rect x="32" y="464" width="936" height="46" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
  <text class="b" x="50" y="483"><tspan class="bb">Render jobs</tspan> use the same vote, but frames are never bit-identical. The client compares them tile by tile</text>
  <text class="b" x="50" y="500">(every tile within 30 dB PSNR) and disputes the ones that differ, with a bond. The tie-breaker re-renders those frames and judges.</text>
</svg>
