<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 450" width="1000" height="450" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <style>
    .t { font-size: 22px; font-weight: 760; fill: #0f172a; letter-spacing: -0.01em; }
    .s { font-size: 14.5px; fill: #64748b; }
    .tick { font-size: 12px; fill: #64748b; font-variant-numeric: tabular-nums; }
    .ax { font-size: 12.5px; fill: #64748b; }
    .lab { font-size: 13px; fill: #334155; }
    .labb { font-size: 13px; font-weight: 700; fill: #0f172a; }
  </style>
  <rect width="1000" height="450" rx="18" fill="#ffffff"/>
  <rect x="0.5" y="0.5" width="999" height="449" rx="18" fill="none" stroke="#e5e7eb"/>
  <text class="t" x="32" y="46">Why cheating doesn’t pay</text>
  <text class="s" x="32" y="71">Faking a job saves at most its price (0.020 ETH in the demo). A caught cheater loses 0.3 ETH of stake.</text>
  <text class="ax" x="100" y="106">Expected gain from faking one job (ETH)</text>
  <line x1="100" y1="152.4" x2="940" y2="152.4" stroke="#eef1f5" stroke-width="1"/>
  <text class="tick" x="90" y="156.4" text-anchor="end">+0.02</text>
  <line x1="100" y1="209.3" x2="940" y2="209.3" stroke="#cbd5e1" stroke-width="1"/>
  <text class="tick" x="90" y="213.3" text-anchor="end">0</text>
  <line x1="100" y1="266.2" x2="940" y2="266.2" stroke="#eef1f5" stroke-width="1"/>
  <text class="tick" x="90" y="270.2" text-anchor="end">−0.02</text>
  <line x1="100" y1="323.1" x2="940" y2="323.1" stroke="#eef1f5" stroke-width="1"/>
  <text class="tick" x="90" y="327.1" text-anchor="end">−0.04</text>
  <line x1="100" y1="380.0" x2="940" y2="380.0" stroke="#eef1f5" stroke-width="1"/>
  <text class="tick" x="90" y="384.0" text-anchor="end">−0.06</text>
  <line x1="100.0" y1="380" x2="100.0" y2="385" stroke="#cbd5e1"/>
  <text class="tick" x="100.0" y="401" text-anchor="middle">0%</text>
  <line x1="268.0" y1="380" x2="268.0" y2="385" stroke="#cbd5e1"/>
  <text class="tick" x="268.0" y="401" text-anchor="middle">5%</text>
  <line x1="436.0" y1="380" x2="436.0" y2="385" stroke="#cbd5e1"/>
  <text class="tick" x="436.0" y="401" text-anchor="middle">10%</text>
  <line x1="604.0" y1="380" x2="604.0" y2="385" stroke="#cbd5e1"/>
  <text class="tick" x="604.0" y="401" text-anchor="middle">15%</text>
  <line x1="772.0" y1="380" x2="772.0" y2="385" stroke="#cbd5e1"/>
  <text class="tick" x="772.0" y="401" text-anchor="middle">20%</text>
  <line x1="940.0" y1="380" x2="940.0" y2="385" stroke="#cbd5e1"/>
  <text class="tick" x="940.0" y="401" text-anchor="middle">25%</text>
  <text class="ax" x="520.0" y="428" text-anchor="middle">Share of jobs the client secretly verifies</text>
  <polygon points="100.0,152.4 324.0,209.3 100.0,209.3" fill="#dc2626" fill-opacity="0.10"/>
  <polygon points="324.0,209.3 940.0,365.8 940.0,209.3" fill="#16a34a" fill-opacity="0.10"/>
  <line x1="100.0" y1="152.4" x2="940.0" y2="365.8" stroke="#2563eb" stroke-width="2" stroke-linecap="round"/>
  <text class="labb" x="112" y="199.3">Cheating pays</text>
  <text class="labb" x="671.2" y="233.3">Cheating loses money</text>
  <text class="lab" x="671.2" y="251.3">gain = 0.020 − 0.3 × share verified</text>
  <text class="lab" x="112" y="142.4">nobody verifies: +0.020 per faked job</text>
  <circle cx="324.0" cy="209.3" r="7" fill="#ffffff"/>
  <circle cx="324.0" cy="209.3" r="5" fill="#2563eb"/>
  <text class="labb" x="336.0" y="197.3">Break-even: 1 job in 15 verified (6.7%)</text>
</svg>
