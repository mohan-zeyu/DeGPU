<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1.5 L9 5 L1 8.5 z" fill="#94a3b8"/></marker>
    <marker id="ahp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1.5 L9 5 L1 8.5 z" fill="#7c3aed"/></marker>
  </defs>
  <style>
    .t { font-size: 22px; font-weight: 760; fill: #0f172a; letter-spacing: -0.01em; }
    .s { font-size: 14.5px; fill: #64748b; }
    .tag { font-size: 11.5px; font-weight: 750; letter-spacing: 0.14em; }
    .h { font-size: 15px; font-weight: 720; fill: #0f172a; }
    .hb { font-size: 13.5px; font-weight: 700; fill: #0f172a; }
    .mono { font-family: 'SF Mono', Menlo, Consolas, monospace; font-size: 12px; fill: #64748b; }
    .monob { font-family: 'SF Mono', Menlo, Consolas, monospace; font-size: 12px; fill: #0f172a; }
    .m { font-size: 12px; fill: #64748b; }
    .b { font-size: 12.5px; fill: #334155; }
    .lab { font-size: 12px; fill: #64748b; font-style: italic; }
  </style>
  <rect width="1000" height="700" rx="18" fill="#ffffff"/>
  <rect x="0.5" y="0.5" width="999" height="699" rx="18" fill="none" stroke="#e5e7eb"/>
  <text class="t" x="32" y="46">Code architecture</text>
  <text class="s" x="32" y="71">On-chain contracts on top, off-chain Python below. Dependencies point down, and the actors never call each other.</text>
  <rect x="32" y="96" width="936" height="144" rx="12" fill="#f5f3ff" stroke="#d8ccfd" stroke-width="1.5"/>
  <circle cx="54" cy="120" r="4.5" fill="#7c3aed"/>
  <text class="tag" x="66" y="124" fill="#7c3aed">ON-CHAIN · SOLIDITY</text>
  <text class="mono" x="246" y="124">contracts/src/</text>
  <rect x="52" y="140" width="220" height="84" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <text class="hb" x="68" y="162">ProviderRegistry</text>
  <text class="b" x="68" y="182">stakes and encryption keys,</text>
  <text class="b" x="68" y="198">price per (market, task),</text>
  <text class="b" x="68" y="214">reputation per market</text>
  <rect x="334" y="140" width="432" height="84" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <text class="hb" x="350" y="162">MarketBase</text>
  <text class="m" x="436" y="162">shared: task table, escrow, payouts</text>
  <rect x="350" y="174" width="196" height="40" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text class="monob" x="448.0" y="191" text-anchor="middle">ReplicatedMarket</text>
  <text class="m" x="448.0" y="206" text-anchor="middle">random re-runs</text>
  <rect x="556" y="174" width="196" height="40" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text class="monob" x="654.0" y="191" text-anchor="middle">CheckedMarket</text>
  <text class="m" x="654.0" y="206" text-anchor="middle">checks every answer</text>
  <path d="M332 182 H276" stroke="#7c3aed" stroke-width="1.5" fill="none" marker-end="url(#ahp)"/>
  <text class="lab" x="304" y="175" text-anchor="middle">lock</text>
  <text class="lab" x="304" y="200" text-anchor="middle">slash</text>
  <rect x="800" y="140" width="148" height="84" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <text class="hb" x="816" y="162">IChecker</text>
  <text class="monob" x="816" y="184">KeySearch</text>
  <text class="monob" x="816" y="200">Checker</text>
  <path d="M766 194 H796" stroke="#7c3aed" stroke-width="1.5" fill="none" marker-end="url(#ahp)"/>
  <text class="tag" x="32" y="288" fill="#94a3b8">3 SHARED</text>
  <text class="tag" x="32" y="304" fill="#94a3b8">CHANNELS</text>
  <rect x="180" y="270" width="240" height="40" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text class="hb" x="300.0" y="287" text-anchor="middle">Contract state</text>
  <text class="m" x="300.0" y="302" text-anchor="middle">getJob: where each job is</text>
  <rect x="440" y="270" width="240" height="40" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text class="hb" x="560.0" y="287" text-anchor="middle">Events</text>
  <text class="m" x="560.0" y="302" text-anchor="middle">the mailbox: “you were picked”</text>
  <rect x="700" y="270" width="240" height="40" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text class="hb" x="820.0" y="287" text-anchor="middle">Encrypted store</text>
  <text class="m" x="820.0" y="302" text-anchor="middle">bulk files, only hashes on-chain</text>
  <path d="M300 244 V266" stroke="#94a3b8" stroke-width="1.5" fill="none" marker-start="url(#ah)" marker-end="url(#ah)"/>
  <path d="M560 244 V266" stroke="#94a3b8" stroke-width="1.5" fill="none" marker-start="url(#ah)" marker-end="url(#ah)"/>
  <path d="M300 314 V336" stroke="#94a3b8" stroke-width="1.5" fill="none" marker-start="url(#ah)" marker-end="url(#ah)"/>
  <path d="M560 314 V336" stroke="#94a3b8" stroke-width="1.5" fill="none" marker-start="url(#ah)" marker-end="url(#ah)"/>
  <path d="M820 314 V336" stroke="#94a3b8" stroke-width="1.5" fill="none" marker-start="url(#ah)" marker-end="url(#ah)"/>
  <rect x="180" y="340" width="370" height="66" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <circle cx="200" cy="362" r="4.5" fill="#0d9488"/>
  <text class="h" x="212" y="367">Client</text>
  <text class="mono" x="270" y="367">client.py</text>
  <text class="b" x="200" y="390">one account: posts jobs, keeps the job secrets</text>
  <rect x="570" y="340" width="370" height="66" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <circle cx="590" cy="362" r="4.5" fill="#2563eb"/>
  <text class="h" x="602" y="367">Provider agent</text>
  <text class="mono" x="722" y="367">agent.py · node.py</text>
  <text class="b" x="590" y="390">one account: offers tasks, runs every role</text>
  <text class="tag" x="32" y="370" fill="#94a3b8">ACTORS</text>
  <path d="M365 408 V432" stroke="#94a3b8" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>
  <path d="M755 408 V432" stroke="#94a3b8" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>
  <text class="lab" x="560" y="426" text-anchor="middle">one driver per mode</text>
  <rect x="32" y="436" width="936" height="62" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <rect x="32" y="436" width="6" height="62" rx="3" fill="#7c3aed"/>
  <text class="h" x="54" y="460">Mode drivers</text>
  <text class="mono" x="54" y="478">degpu/modes/</text>
  <text class="m" x="200" y="460">the off-chain half of each market:</text>
  <text class="m" x="200" y="476">who does what in which phase</text>
  <rect x="420" y="454" width="160" height="26" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text class="monob" x="500.0" y="471" text-anchor="middle">replicated.py</text>
  <rect x="592" y="454" width="160" height="26" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text class="monob" x="672.0" y="471" text-anchor="middle">checked.py</text>
  <rect x="764" y="454" width="186" height="26" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text class="monob" x="857.0" y="471" text-anchor="middle">base.py · driver API</text>
  <path d="M500 500 V524" stroke="#94a3b8" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>
  <text class="lab" x="512" y="518">task hooks: prepare, run or solve, similar, present</text>
  <rect x="32" y="528" width="936" height="62" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <rect x="32" y="528" width="6" height="62" rx="3" fill="#d97706"/>
  <text class="h" x="54" y="552">Job types</text>
  <text class="mono" x="54" y="570">degpu/tasks/</text>
  <text class="m" x="200" y="552">what runs: inputs, compute,</text>
  <text class="m" x="200" y="568">result format, decoding</text>
  <rect x="380" y="546" width="180" height="26" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text class="monob" x="470.0" y="563" text-anchor="middle">image_classify_v1/</text>
  <rect x="572" y="546" width="180" height="26" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text class="monob" x="662.0" y="563" text-anchor="middle">blender_render_v1/</text>
  <rect x="764" y="546" width="186" height="26" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text class="monob" x="857.0" y="563" text-anchor="middle">key_search_v1/</text>
  <rect x="32" y="610" width="936" height="62" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <rect x="32" y="610" width="6" height="62" rx="3" fill="#94a3b8"/>
  <text class="h" x="54" y="634">Shared libraries</text>
  <text class="mono" x="54" y="652">degpu/</text>
  <text class="m" x="200" y="634">used by every layer</text>
  <text class="m" x="200" y="650">above</text>
  <rect x="380" y="622" width="180" height="40" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text class="monob" x="470.0" y="639" text-anchor="middle">crypto.py</text>
  <text class="m" x="470.0" y="654" text-anchor="middle">hashes, sealing, NaCl</text>
  <rect x="572" y="622" width="180" height="40" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text class="monob" x="662.0" y="639" text-anchor="middle">chain.py</text>
  <text class="m" x="662.0" y="654" text-anchor="middle">deploy, transactions, events</text>
  <rect x="764" y="622" width="186" height="40" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text class="monob" x="857.0" y="639" text-anchor="middle">storage.py</text>
  <text class="m" x="857.0" y="654" text-anchor="middle">content-addressed files</text>
</svg>
