[project]
name = "degpu"
version = "0.1.0"
description = "DeGPU: a small decentralized compute marketplace (course project)"
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "web3>=7",
    "pynacl>=1.5",
    "onnxruntime>=1.20",
    "pillow>=11",
    "numpy>=2",
    "pycryptodome>=3.20",
    "eth-abi>=5",
    "eth-utils>=5",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["degpu"]

[tool.pytest.ini_options]
testpaths = ["tests"]
